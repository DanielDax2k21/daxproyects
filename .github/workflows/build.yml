name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema para Buildozer
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Compilar APK
      run: |
        buildozer -v android debug

    - name: Subir APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: app-android-debug
        path: bin/*.apk